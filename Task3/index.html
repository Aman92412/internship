<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Calculator</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<!-- calculator body container -->
    <div class="calcu-container">
        <!-- input box container -->
        <div class="inputbox">
            <input type="text" class="display">
            <input type="" placeholder="" class="input" >
        </div>

        <!-- all operations of the rows -->
        <div class="box">
            <div class="row ">
                <button class="del">del</button>
                <button class="clear">clear</button>
                <button class="ans">ans</button>
            </div>
            <div class="row">
                <button class="value">7</button>
                <button class="value">8</button>
                <button class="value">9</button>
                <button class="operation">%</button>
                <button class="operation ">/</button>
            </div>
            <div class="row">
                <button class="value">4</button>
                <button class="value">5</button>
                <button class="value">6</button>
                <button class="operation ">*</button>
                <button class="operation ">**</button>
            </div>
            <div class="row">
                <button class="value">1</button>
                <button class="value">2</button>
                <button class="value">3</button>
                <button class="operation ">+</button>
                <button class="operation ">-</button>
            </div>
            <div class="row">
                <button class="value">0</button>
                <button class="value">00</button>
                <button class="value">.</button>
                <button class="enter">Enter</button>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
